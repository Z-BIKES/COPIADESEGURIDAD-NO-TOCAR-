<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernando Zapoteco | Chiapas Bike</title>
    <meta name="description" content="Fernando Zapoteco - Maestría y disciplina. Formación y mentoría.">
    <link rel="icon" type="image/png" href="z.png">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --gold: #d4af37;
        }
        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        [x-cloak] { display: none !important; }

        /* Entrada general */
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Aparición al hacer scroll */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.9s ease-out, transform 0.9s ease-out;
        }
        .reveal.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Botón CTA pulsante */
        .banner-pulse {
            animation: pulseGlow 1.6s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 6px rgba(255,60,60,0.5); }
            50% { box-shadow: 0 0 22px rgba(255,60,60,0.95); }
        }

        /* Brillo dorado flotante en el hero */
        .float-glow {
            animation: floatGlow 6s ease-in-out infinite;
        }
        @keyframes floatGlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        /* Línea dorada animada bajo títulos */
        .gold-underline {
            position: relative;
        }
        .gold-underline::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -8px;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.6s ease, left 0.6s ease;
        }
        .gold-underline.is-visible::after {
            width: 60px;
            left: calc(50% - 30px);
        }

        /* Fondo con textura sutil */
        .texture-bg {
            background-image: radial-gradient(circle at 1px 1px, rgba(212,175,55,0.15) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Botón de políticas */
        .policy-link {
            transition: color 0.3s ease, letter-spacing 0.3s ease;
        }
        .policy-link:hover {
            color: var(--gold);
            letter-spacing: 2px;
        }

        /* Scrollbar dorada sutil */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fff; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
    </style>
</head>
<body class="bg-white text-black" x-data="{ page: 'home', isMenuOpen: false }">

    <!-- Navegación -->
    <nav class="flex justify-between items-center px-6 py-8 border-b border-gray-100 bg-white/90 backdrop-blur sticky top-0 z-50">
        <div class="flex flex-col cursor-pointer" @click="page = 'home'; window.scrollTo(0,0)">
            <span class="font-cinzel font-black tracking-widest text-lg">
                CHIAPAS<span class="text-[#d4af37]">BIKE</span>
            </span>
            <span class="text-[10px] uppercase tracking-[3px] opacity-40 font-semibold">Fernando Zapoteco</span>
        </div>

        <div class="md:hidden">
            <button @click="isMenuOpen = !isMenuOpen" aria-label="Menu">
                <i data-lucide="menu" x-show="!isMenuOpen"></i>
                <i data-lucide="x" x-show="isMenuOpen"></i>
            </button>
        </div>
        <div class="hidden md:flex gap-8 items-center text-sm font-medium uppercase tracking-wider">
            <button @click="page = 'home'; window.scrollTo(0,0)" :class="page === 'home' ? 'text-[#d4af37]' : ''" class="hover:text-[#d4af37] transition-colors">Inicio</button>
            <button onclick="window.location.href='curso.html'" class="hover:text-[#d4af37] transition-colors">Academia</button>
        </div>
        <!-- Menú Móvil -->
        <div x-show="isMenuOpen" x-cloak @click.away="isMenuOpen = false" x-transition class="absolute top-full left-0 w-full bg-white border-b border-gray-100 flex flex-col p-6 gap-4 md:hidden shadow-xl">
            <button @click="page = 'home'; isMenuOpen = false; window.scrollTo(0,0)" class="text-left py-2 border-b border-gray-50">Inicio</button>
            <button onclick="window.location.href='curso.html'" class="text-left py-2 border-b border-gray-50">Academia</button>
            <button onclick="window.location.href='politicas.html'" class="text-left py-2">Políticas</button>
        </div>
    </nav>

    <main>
        <!-- Inicio -->
        <template x-if="page === 'home'">
            <div class="fade-in">

                <!-- Hero -->
                <section class="px-6 md:px-20 py-12 md:py-20 flex flex-col md:flex-row items-center gap-12">
                    <div class="flex-1 flex flex-col items-center gap-6">
                        <div class="relative group float-glow">
                            <div class="absolute -inset-1 bg-[#d4af37] rounded-sm blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                            <img src="tu-foto.png" alt="Fernando Zapoteco" class="relative w-full max-w-sm border border-[#d4af37] p-2 bg-white shadow-[20px_20px_0px_-5px_#d4af37] hover:translate-x-2 hover:translate-y-2 hover:shadow-none transition-all duration-500" onerror="this.src='https://via.placeholder.com/380x450?text=FZ'">
                        </div>

                        <!-- Enlace destacado -->
                        <a href="https://mongemalo.com/mentoria/?via=fernando" target="_blank" rel="noopener noreferrer"
                           class="banner-pulse group/link relative w-full max-w-sm text-center bg-gradient-to-r from-red-600 via-red-500 to-red-600 text-white px-6 py-6 border-2 border-[#d4af37] hover:from-[#d4af37] hover:via-yellow-400 hover:to-[#d4af37] hover:text-black transition-all duration-300">
                            <span class="block font-cinzel text-2xl md:text-3xl font-black uppercase tracking-wide leading-tight">
                                ¡Estoy Aquí! 👇
                            </span>
                            <span class="block text-sm md:text-base font-bold uppercase tracking-widest mt-2 opacity-95">
                                Entra a la Mentoría Ahora
                            </span>
                        </a>
                    </div>
                    <div class="flex-[1.5] space-y-6">
                        <h1 class="font-cinzel text-4xl md:text-6xl font-black leading-tight">
                            FERNANDO <br> <span class="text-[#d4af37]">ZAPOTECO</span>
                        </h1>
                        <p class="font-playfair italic text-[#d4af37] text-xl md:text-2xl border-l-2 border-[#d4af37] pl-4">
                            "En la escuela te prohibieron copiar, en la vida real para ser el mejor está permitido."
                        </p>
                    </div>
                </section>

                <!-- Sección Únete -->
                <section class="reveal mx-6 md:mx-20 my-16 p-12 text-center border-2 border-[#d4af37] flex flex-col items-center texture-bg">
                    <h2 class="gold-underline font-cinzel tracking-[4px] text-[#d4af37] text-3xl font-black uppercase mb-6">Únete</h2>
                    <p class="text-gray-600 mb-8 italic">Estrategias de dominio personal directamente en tu correo.</p>
                    <form class="w-full max-w-md space-y-4" action="https://app.moosend.com/subscribe/058d10f3-e0eb-4a68-9880-da696f226211" method="POST" target="_blank">
                        <input type="email" name="ms-email" placeholder="Tu mejor correo..." class="w-full p-4 border border-[#d4af37] text-center outline-none focus:ring-1 focus:ring-[#d4af37] transition-shadow" required>
                        <button type="submit" class="w-full py-4 bg-[#d4af37] text-black font-bold uppercase tracking-widest hover:bg-black hover:text-[#d4af37] transition-all duration-300">Reclamar Acceso</button>
                    </form>
                </section>

            </div>
        </template>
    </main>

    <!-- Pie de página -->
    <footer class="bg-black text-white px-6 py-20 mt-20 text-center border-t border-[#d4af37]">
        <div class="flex flex-col items-center gap-6">
            <button onclick="window.location.href='politicas.html'" class="policy-link text-xs uppercase tracking-[3px] font-semibold text-gray-300">
                Políticas y Aviso Legal
            </button>
            <div class="space-y-2 opacity-40 text-[10px] uppercase tracking-[3px] font-bold">
                <p>© 2026 FERNANDO ZAPOTECO GORDILLO.</p>
                <p class="tracking-[5px]">Maestría y Disciplina</p>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Animación al hacer scroll (compatible con GitHub Pages, sin dependencias externas)
            const revealEls = document.querySelectorAll('.reveal, .gold-underline');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, { threshold: 0.15 });
            revealEls.forEach(el => observer.observe(el));
        });

        document.addEventListener('alpine:initialized', () => {
            Alpine.effect(() => {
                setTimeout(() => lucide.createIcons(), 50);
            });
        });
    </script>
</body>
</html>
