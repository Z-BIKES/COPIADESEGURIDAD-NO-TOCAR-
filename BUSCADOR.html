<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador | Fernando Zapoteco</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14140f;
    --bg-panel:#1c1c14;
    --ink:#f1ecdf;
    --ink-muted:#a39c89;
    --ink-dim:#716b5b;
    --accent:#c28a3e;
    --accent-deep:#8c5f26;
    --line:#37361f;
    --line-soft:#26251a;
    --radius:2px;
    --maxw:1180px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  h1,.display{font-family:'Fraunces',serif;font-weight:700;letter-spacing:-0.01em;margin:0;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
  @media(max-width:640px){.wrap{padding:0 20px;}}

  header{
    background:rgba(20,20,15,0.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:76px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--line);}
  .brand-text{display:flex;flex-direction:column;line-height:1.1;}
  .brand-text strong{font-family:'Fraunces',serif;font-size:16px;font-weight:700;letter-spacing:0.02em;}
  .brand-text span{font-size:11.5px;color:var(--ink-muted);letter-spacing:0.03em;}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--accent);color:var(--accent);background:var(--bg-panel);
  }
  .icon-btn svg{width:17px;height:17px;}

  main{flex:1;display:flex;align-items:center;}
  .search-block{width:100%;padding:96px 0;}
  .eyebrow{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
  .eyebrow::before{content:'';width:26px;height:1px;background:var(--accent);display:inline-block;}
  h1{font-size:clamp(32px,5vw,52px);max-width:14ch;line-height:1.08;}
  .search-sub{margin-top:18px;color:var(--ink-muted);font-size:16px;max-width:48ch;line-height:1.6;}

  form.search-box{
    margin-top:44px;display:flex;gap:0;max-width:640px;
    border:1px solid var(--line);background:var(--bg-panel);
  }
  form.search-box input{
    flex:1;background:transparent;border:none;color:var(--ink);
    font-family:'Work Sans',sans-serif;font-size:16px;padding:18px 20px;outline:none;
  }
  form.search-box input::placeholder{color:var(--ink-dim);}
  form.search-box button{
    background:var(--accent);border:none;color:#161307;font-weight:600;
    padding:0 26px;cursor:pointer;font-family:'Work Sans',sans-serif;font-size:14px;
    transition:background .2s ease;
  }
  form.search-box button:hover{background:#d69a4d;}
  .search-note{margin-top:16px;font-size:13px;color:var(--ink-dim);}
  .search-status{margin-top:16px;font-size:13px;color:var(--ink-dim);display:flex;align-items:center;gap:10px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);flex-shrink:0;}
  .dot.live{background:var(--accent);animation:pulse 1.4s ease-in-out infinite;}
  .dot.error{background:#b8503f;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .results{margin-top:36px;max-width:760px;}
  .result-count{font-size:13px;color:var(--ink-dim);margin-bottom:18px;}
  .result-item{
    display:block;padding:20px 0;border-bottom:1px solid var(--line-soft);
  }
  .result-item:hover .result-title{color:var(--accent);}
  .result-path{font-size:12px;color:var(--accent);letter-spacing:0.02em;margin-bottom:6px;}
  .result-title{font-size:18px;font-family:'Fraunces',serif;font-weight:600;color:var(--ink);transition:color .15s ease;}
  .result-snippet{margin-top:8px;font-size:14px;color:var(--ink-muted);line-height:1.55;}
  .result-snippet mark{background:var(--accent);color:#161307;padding:0 2px;border-radius:1px;}
  .empty-state{margin-top:8px;font-size:14px;color:var(--ink-dim);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand">
      <img src="https://raw.githubusercontent.com/Z-BIKES/COPIADESEGURIDAD-NO-TOCAR-/main/tu-foto.png" alt="Fernando Zapoteco">
      <div class="brand-text">
        <strong>FERNANDO ZAPOTECO</strong>
        <span>Mentoría de Ventas</span>
      </div>
    </a>
    <a href="buscador.html" class="icon-btn" aria-label="Buscador">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </a>
  </nav>
</header>

<main>
  <div class="wrap search-block">
    <div class="eyebrow">Buscador</div>
    <h1>Encuentra un tema en el sitio.</h1>
    <p class="search-sub">Busca entre las publicaciones y páginas de Fernando Zapoteco. La lógica de búsqueda se conecta aquí.</p>

    <form class="search-box" id="searchForm">
      <input type="search" id="searchInput" placeholder="Escribe un tema, por ejemplo: seguimiento de ventas" aria-label="Buscar" disabled>
      <button type="submit">Buscar</button>
    </form>
    <div class="search-status" id="statusLine">
      <span class="dot live" id="statusDot"></span>
      <span id="statusText">Escaneando archivos .html del repositorio…</span>
    </div>

    <div class="results" id="results"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-copy">© 2026 FERNANDO ZAPOTECO GORDILLO.</div>
  </div>
</footer>

<script>
/* ============================================================
   BUSCADOR — escanea SOLO archivos .html del repo de GitHub
   y busca en tiempo real sobre su contenido.

   CONFIGURA ESTAS 3 LÍNEAS con los datos de tu repo:
   ============================================================ */
const REPO_OWNER  = 'Z-BIKES';
const REPO_NAME   = 'COPIADESEGURIDAD-NO-TOCAR-';
const REPO_BRANCH = 'main';                // rama que publica GitHub Pages
/* ============================================================ */

const input      = document.getElementById('searchInput');
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const resultsEl  = document.getElementById('results');
const CACHE_KEY  = 'fz-buscador-index-v1';
const CACHE_TTL  = 1000 * 60 * 30; // 30 min: re-escanea el repo cada media hora

let index = []; // [{ path, title, text }]

function setStatus(text, mode){
  statusText.textContent = text;
  statusDot.className = 'dot' + (mode ? ' ' + mode : '');
}

function stripHtml(htmlString){
  const doc = new DOMParser().parseFromString(htmlString, 'text/html');
  doc.querySelectorAll('script, style, noscript').forEach(el => el.remove());
  const title = (doc.querySelector('title')?.textContent || '').trim();
  const text = (doc.body?.textContent || '').replace(/\s+/g, ' ').trim();
  return { title, text };
}

async function fetchJSON(url){
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + ' → ' + res.status);
  return res.json();
}

async function scanRepo(){
  // 1. Cache local para no re-escanear el repo en cada visita
  try {
    const cached = JSON.parse(sessionStorage.getItem(CACHE_KEY) || 'null');
    if (cached && (Date.now() - cached.time) < CACHE_TTL) {
      index = cached.index;
      setStatus(index.length + ' páginas .html indexadas', null);
      input.disabled = false;
      return;
    }
  } catch (_) {}

  // 2. Listar TODO el árbol del repo y quedarnos solo con .html
  //    (si la rama configurada no existe, intenta con 'master' como respaldo)
  let tree, branchUsed = REPO_BRANCH;
  try {
    tree = await fetchJSON(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${REPO_BRANCH}?recursive=1`
    );
  } catch (err) {
    branchUsed = 'master';
    tree = await fetchJSON(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/master?recursive=1`
    );
  }
  const htmlFiles = (tree.tree || []).filter(
    item => item.type === 'blob' && item.path.toLowerCase().endsWith('.html')
  );

  if (htmlFiles.length === 0) {
    setStatus('No se encontraron archivos .html en el repositorio.', 'error');
    return;
  }

  setStatus(`Descargando ${htmlFiles.length} archivos .html…`, 'live');

  // 3. Descargar y extraer texto de cada archivo .html en paralelo
  const built = await Promise.all(htmlFiles.map(async (file) => {
    try {
      const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${branchUsed}/${file.path}`;
      const res = await fetch(rawUrl);
      if (!res.ok) return null;
      const html = await res.text();
      const { title, text } = stripHtml(html);
      return { path: file.path, title: title || file.path, text };
    } catch (_) {
      return null;
    }
  }));

  index = built.filter(Boolean);

  try {
    sessionStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), index }));
  } catch (_) {}

  setStatus(index.length + ' páginas .html indexadas', null);
  input.disabled = false;
  input.focus();
}

function snippetAround(text, query){
  const lower = text.toLowerCase();
  const pos = lower.indexOf(query.toLowerCase());
  if (pos === -1) return text.slice(0, 140) + '…';
  const start = Math.max(0, pos - 60);
  const end = Math.min(text.length, pos + query.length + 80);
  let snippet = (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
  const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
  snippet = snippet.replace(re, m => `<mark>${m}</mark>`);
  return snippet;
}

function render(query){
  if (!query.trim()) {
    resultsEl.innerHTML = '';
    return;
  }
  const q = query.trim().toLowerCase();
  const matches = index.filter(page =>
    page.title.toLowerCase().includes(q) || page.text.toLowerCase().includes(q)
  );

  if (matches.length === 0) {
    resultsEl.innerHTML = `<p class="empty-state">Sin resultados para “${query}”.</p>`;
    return;
  }

  resultsEl.innerHTML =
    `<p class="result-count">${matches.length} resultado${matches.length === 1 ? '' : 's'}</p>` +
    matches.map(page => `
      <a class="result-item" href="${page.path}">
        <div class="result-path">${page.path}</div>
        <div class="result-title">${page.title}</div>
        <div class="result-snippet">${snippetAround(page.text, query)}</div>
      </a>
    `).join('');
}

input.addEventListener('input', () => render(input.value));
document.getElementById('searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  render(input.value);
});

scanRepo().catch(err => {
  console.error(err);
  setStatus('No se pudo escanear el repositorio. Revisa REPO_OWNER / REPO_NAME en el código.', 'error');
});
</script>

</body>
</html>
